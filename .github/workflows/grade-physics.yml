name: Deploy grade-physics

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the grading function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Add repository secrets SUPABASE_ACCESS_TOKEN and DEEPSEEK_API_KEY, then run this workflow again."
            exit 1
          fi
          supabase secrets set DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" --project-ref inwrpyaaryzkkruzcbgm
          supabase functions deploy grade-physics --project-ref inwrpyaaryzkkruzcbgm
